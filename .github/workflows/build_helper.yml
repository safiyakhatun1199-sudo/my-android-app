name: Build Native Overlay APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Clean Project Structure
        run: |
          rm -f build.gradle settings.gradle app/build.gradle
          mkdir -p app/src/main/java/com/aimtool/overlay

          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/
          [ -f "OverlayService.java" ] && mv OverlayService.java app/src/main/java/com/aimtool/overlay/

          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 33
              namespace 'com.aimtool.overlay'
              defaultConfig {
                  applicationId "com.aimtool.overlay"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Build APK Using Direct Gradle
        run: gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimTool-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
