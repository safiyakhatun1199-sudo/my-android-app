name: Build Native Overlay APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Generate Android Gradle Structure
        run: |
          # 1. Clean existing Gradle configs
          rm -f build.gradle settings.gradle app/build.gradle

          # 2. Setup root settings.gradle
          echo "include ':app'" > settings.gradle

          # 3. Setup root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 4. Create app directory structure
          mkdir -p app/src/main/java/com/aimtool/overlay
          mkdir -p gradle/wrapper

          # 5. Create valid gradle-wrapper.properties (Forcing Gradle 7.5)
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 6. Move files if placed incorrectly
          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/
          [ -f "OverlayService.java" ] && mv OverlayService.java app/src/main/java/com/aimtool/overlay/

          # 7. Setup app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }

          android {
              compileSdk 33
              namespace 'com.aimtool.overlay'

              defaultConfig {
                  applicationId "com.aimtool.overlay"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimTool-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
