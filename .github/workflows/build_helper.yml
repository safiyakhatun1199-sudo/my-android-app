name: Build Native Overlay APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Setup Clean Project Structure
        run: |
          # Clean old files
          rm -rf app settings.gradle build.gradle

          # Create directories
          mkdir -p app/src/main/java/com/aimtool/overlay

          # Create settings.gradle
          echo "include ':app'" > settings.gradle

          # Create root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # Create app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }

          android {
              compileSdk 33
              namespace 'com.aimtool.overlay'

              defaultConfig {
                  applicationId "com.aimtool.overlay"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # Create clean AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android.permission.SYSTEM_ALERT_WINDOW />
              <uses-permission android.permission.FOREGROUND_SERVICE />

              <application
                  android.allowBackup="true"
                  android.label="Aim Tool Overlay"
                  android.supportsRtl="true"
                  android.theme="@android:style/Theme.DeviceDefault">

                  <activity 
                      android.name=".MainActivity"
                      android.exported="true">
                      <intent-filter>
                          <action android.name="android.intent.action.MAIN" />
                          <category android.name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service 
                      android.name=".OverlayService"
                      android.enabled="true"
                      android.exported="false" />

              </application>
          </manifest>
          EOF

          # Create MainActivity.java
          cat << 'EOF' > app/src/main/java/com/aimtool/overlay/MainActivity.java
          package com.aimtool.overlay;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName()));
                      startActivityForResult(intent, 1234);
                      Toast.makeText(this, "Please grant Overlay Permission", Toast.LENGTH_LONG).show();
                  } else {
                      startOverlayService();
                  }
              }

              private void startOverlayService() {
                  Intent intent = new Intent(this, OverlayService.class);
                  startService(intent);
                  Toast.makeText(this, "Aim Tool Overlay Started!", Toast.LENGTH_SHORT).show();
                  finish();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == 1234) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && Settings.canDrawOverlays(this)) {
                          startOverlayService();
                      } else {
                          Toast.makeText(this, "Overlay Permission Required!", Toast.LENGTH_SHORT).show();
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimTool-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
