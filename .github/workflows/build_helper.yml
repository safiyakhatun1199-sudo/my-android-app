name: Build Native Overlay APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK with Build-Action
        uses: simple-elf/github-action-build-android@v1.2.0
        with:
          build-type: apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimTool-Overlay-APK
          path: "**/*.apk"
          
