name: Build Native Overlay APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK via Gradle
        run: |
          mkdir -p app/src/main
          cp -r AndroidManifest.xml app/src/main/
          cp -r OverlayService.java app/src/main/
          echo "apply plugin: 'com.android.application'" > build.gradle
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimTool-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
